# TimeMark 同步服务 nginx 反向代理
# 监听 18443/TCP（非标端口，避开腾讯云未备案域名拦截）
# TLS 证书：Let's Encrypt（由 acme.sh + Cloudflare DNS-01 自动签发/续期）
# 后端：TimeMark Spring Boot @ 127.0.0.1:18080
#
# 部署步骤见 deploy/TLS-CUTOVER.md
# 证书路径由 acme.sh --install-cert 安装到 /etc/nginx/ssl/sync.knowhub.chat/

# 登录/注册限速：避免脚本暴力撞库与批量注册
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sync:10m rate=60r/m;

# HTTP → HTTPS 重定向（可选，18080 端口仅本机访问时不需要）
# 如果未来想让用户访问 http://sync.knowhub.chat 自动跳转，可以加这段
# server {
#     listen 80;
#     listen [::]:80;
#     server_name sync.knowhub.chat;
#     location / { return 301 https://$host:18443$request_uri; }
# }

server {
    listen 18443 ssl;
    listen [::]:18443 ssl;
    # 注意：不写 `http2 on;`（那是 nginx 1.25.1+ 新语法）。服务器为 nginx 1.18，
    # 若要 HTTP/2 请用旧写法 `listen 18443 ssl http2;`；本同步 API 载荷小，HTTP/1.1 足够。
    server_name sync.knowhub.chat;

    # Let's Encrypt 证书（acme.sh 安装后的路径）
    ssl_certificate     /etc/nginx/ssl/sync.knowhub.chat/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/sync.knowhub.chat/sync.knowhub.chat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：强制浏览器/客户端在一年内只用 HTTPS（18443 端口也生效）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 同步队列每 4 秒一轮，响应体很小，没必要开压缩
    gzip off;
    client_max_body_size 2m;

    # 登录/注册：严格限速
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 同步接口：宽松限速（每 4 秒一轮 push/pull）
    location /api/ {
        limit_req zone=sync burst=120 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 健康检查：不记日志、不限速
    location /api/v1/health {
        proxy_pass http://127.0.0.1:18080;
        access_log off;
    }

    # 其他路径返回 404（避免暴露后端信息）
    location / {
        return 404;
    }

    access_log /var/log/nginx/timemark-access.log;
    error_log /var/log/nginx/timemark-error.log;
}
