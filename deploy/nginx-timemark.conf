# TimeMark 同步服务反向代理（TLS 在此终结，后端只听 127.0.0.1:18080）
# 用法见 deploy/TLS-CUTOVER.md。把 sync.example.com 换成你的域名。

# 登录/注册限速：避免脚本暴力撞库与批量注册
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sync:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;

    # certbot --redirect 会自动改写这段；在此之前先保证 ACME 挑战可达
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    http3 on;
    quic on;
    server_name sync.example.com;

    ssl_certificate     /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 同步队列每 4 秒一轮，响应体很小，没必要开压缩
    gzip off;
    client_max_body_size 2m;

    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=sync burst=120 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/health {
        proxy_pass http://127.0.0.1:18080;
        access_log off;
    }
}
