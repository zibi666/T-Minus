name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: 版本号与契约 fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: VERSION 与三端一致
        run: node tools/version.mjs
      - name: fixture 是合法 JSON
        run: node -e "JSON.parse(require('fs').readFileSync('shared/contract/fixtures/contract.json','utf8'))"

  windows:
    name: Windows 端（typecheck / lint / test）
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - run: npm ci
        working-directory: apps/windows
      - run: npm run lint
        working-directory: apps/windows
      - run: npm run typecheck
        working-directory: apps/windows
      - name: 单元测试（契约 fixture + 引擎纯函数 + 仓库守卫）
        run: npm test
        working-directory: apps/windows

  android:
    name: Android 端（单元测试 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # 以前这里是 android-actions/setup-android@v3，它按「latest」拼 cmdline-tools 的下载地址，
      # 而 Google 现在要求先同意服务条款才放行那个链接 → 固定 404 → 这一步必失败，
      # 四个 job 里只有 Android 红，而且从来没跑到过 Gradle。
      # ubuntu-latest 镜像本来就预装了 Android SDK（cmdline-tools + platforms/android-35 +
      # build-tools/35.0.0 + 已接受许可），所以改成「缺什么补什么」：预装齐全就零下载，
      # 镜像哪天把 android-35 裁掉了也能自愈，不会再把 CI 挂死。
      - name: 确保 compileSdk 平台与 build-tools 就位
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_DIR"
          if [ -d "$SDK_DIR/platforms/android-35" ] && [ -d "$SDK_DIR/build-tools/35.0.0" ]; then
            echo "镜像已预装 platforms/android-35 与 build-tools/35.0.0，跳过下载"
            exit 0
          fi
          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: 单元测试（含跨端契约 fixture 一致性）
        run: ./gradlew :app:testDebugUnitTest
        working-directory: apps/android
      - name: Debug 构建
        run: ./gradlew :app:assembleDebug
        working-directory: apps/android
      - name: 产物里的版本号必须等于仓库根 VERSION
        run: |
          node -e "
          const fs=require('fs');
          const want=fs.readFileSync('VERSION','utf-8').trim();
          const meta=JSON.parse(fs.readFileSync('apps/android/app/build/outputs/apk/debug/output-metadata.json','utf-8'));
          const got=meta.elements[0].versionName;
          if(got!==want){console.error('APK versionName='+got+' 期望 '+want);process.exit(1)}
          console.log('APK 版本号核对通过：v'+got);
          "

  backend:
    name: 同步服务端（编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 列白名单与客户端契约一致
        run: node tools/check-sync-columns.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
      - run: mvn -B -q -DskipTests package
        working-directory: backend
