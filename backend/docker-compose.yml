services:
  timemark-server:
    build: .
    container_name: timemark-server
    ports:
      - "8080:8080"
    environment:
      TIMEMARK_DB_URL: ${TIMEMARK_DB_URL}
      TIMEMARK_DB_USER: ${TIMEMARK_DB_USER}
      TIMEMARK_DB_PASSWORD: ${TIMEMARK_DB_PASSWORD}
      TIMEMARK_JWT_SECRET: ${TIMEMARK_JWT_SECRET:-}
      SERVER_PORT: ${TIMEMARK_SERVER_PORT:-8080}
    restart: unless-stopped
